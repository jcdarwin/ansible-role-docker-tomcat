---
# tasks file for mebooks.ansible-role-docker-tomcat

- name: Debug tomcat var
  debug: var=tomcat
  tags:
  - traefik
  - tomcat
  - docker

- name: Ensure tomcat directories exist
  file:
    path: "{{ item }}"
    state: directory
  with_items:
  - /etc/tomcat
  - /etc/tomcat/webapps
  - /etc/tomcat/temp
  tags:
  - traefik
  - tomcat
  - docker

# https://hub.docker.com/_/tomcat/
- name: Deploy tomcat container
  docker_container:
    name: tomcat
    image: tomcat:alpine
    restart_policy: unless-stopped
    volumes:
    - /etc/tomcat/webapps:/usr/local/tomcat/webapps:rw
    - /etc/tomcat/temp:/usr/local/tomcat/temp:rw
    labels:
      traefik.enable: "true"
      traefik.backend: epubcheck
      traefik.frontend.rule: "Host:epubcheck.{{ tomcat.domain }}; AddPrefix: /epubcheck"
      traefik.port: "8080"
      com.datadoghq.ad.logs: '[{"source": "do.mebooks.co.nz", "service": "tomcat"}]'
  tags:
  - traefik
  - tomcat
  - docker

# ###############
# # cron jobs
- name: Set a weekly cron job to clear out the tomcat temp directory
  action: template
    src=templates/cron_clear_temp.j2
    dest=/etc/cron.weekly/tomcat_clear_temp
    mode=0755
  tags:
  - traefik
  - tomcat
  - docker

- name: Check that our cron is valid
  command: run-parts --test --verbose /etc/cron.weekly
  register: result
  tags:
  - traefik
  - tomcat
  - docker

- name: Show the result of our cron
  debug: var=result
  tags:
  - traefik
  - tomcat
  - docker
