---
# tasks file for mebooks.ansible-role-docker-tomcat

- name: Debug tomcat var
  debug: var=tomcat
  tags:
  - traefik
  - tomcat
  - docker

# The image (an epubcheck-web build) contains the webapp, so nothing is mounted from the host.
# It isn't on a registry: load it on the host first (docker save | ssh … docker load).
- name: Deploy tomcat container
  docker_container:
    name: tomcat
    image: "{{ tomcat.image }}"
    pull: false
    restart_policy: unless-stopped
    log_driver: json-file
    log_options:
      max-size: 10m
      max-file: "5"
    labels:
      traefik.enable: "true"
      traefik.backend: epubcheck
      traefik.frontend.rule: "Host:epubcheck.{{ tomcat.domain }}; AddPrefix: /epubcheck"
      traefik.port: "8080"
  tags:
  - traefik
  - tomcat
  - docker

# The servlet deletes its temp files after each request, so the weekly clean-up of the old
# /etc/tomcat/temp mount isn't needed.
- name: Remove the weekly tomcat temp clean-up
  file:
    path: /etc/cron.weekly/tomcat_clear_temp
    state: absent
  tags:
  - traefik
  - tomcat
  - docker
